name: version-bump

# 릴리즈 브랜치(.github/release.env 의 RELEASE_BRANCHES)로 가는 PR 이 머지되기 전에, 버전 파일의 version 을
# PR 의 버전 레이블(patch, minor, major)에 맞게 올려 둔다 (#107). 버전 레이블이 없으면 그대로 둔다.
# 룰셋이 이 체크를 필수로 걸어, bump commit 이 없으면 머지할 수 없다.
#
# on.pull_request.branches 는 파일을 읽을 수 없어 모든 PR 에서 돌고, 대상 브랜치가 아니면 설정 단계 뒤에 끝난다.
#
# bump commit 은 RELEASE_BOT_TOKEN(PAT) 으로 push 한다. GITHUB_TOKEN 으로 push 하면 GitHub 이 이 워크플로를
# 다시 돌리지 않아, 새 head 커밋에 필수 체크가 영영 달리지 않는다.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: version-bump-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - name: PR 브랜치 가져오기
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.RELEASE_BOT_TOKEN }}

      - name: 설정 읽기
        id: config
        uses: ./.github/actions/release-config
        with:
          base-ref: ${{ github.base_ref }}

      - name: 버전 맞추기
        id: version
        if: steps.config.outputs.enabled == 'true'
        uses: ./.github/actions/ensure-version
        with:
          base-ref: ${{ github.base_ref }}
          labels: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          ref: ${{ github.event.pull_request.head.ref }}
          version-file: ${{ steps.config.outputs.version-file }}
          commit-message: 'chore/#${{ github.event.pull_request.number }}: bump version to {version}'

      # 이 실행은 옛 head 커밋의 결과다. 방금 push 로 새 커밋에서 다시 도는 실행이 통과를 낸다
      - name: bump commit 을 올렸으면 새 커밋의 체크로 넘기기
        if: steps.version.outputs.committed == 'true'
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          echo "::error::버전이 $PREVIOUS 라서 $NEXT 로 올리는 커밋을 push 했습니다. 새 커밋의 체크를 기다립니다."
          exit 1
